name: Android debug APK

# Manual only — builds an UNSIGNED debug APK as a downloadable artifact.
# No signing secrets in the repo; for personal sideloading, not for distribution.
# NOTE: authored but not yet run against a device/emulator — treat the first run
# as the validation.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      # android/ is gitignored (regenerated here from the committed config)
      - run: npx cap add android
      - run: npx cap sync android
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: degree-lens-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
